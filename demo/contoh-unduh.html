<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Leura — contoh halaman unduh</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        font:
          16px/1.5 -apple-system,
          BlinkMacSystemFont,
          'Inter',
          system-ui,
          sans-serif;
        color: #1d1d1f;
        background:
          radial-gradient(60% 50% at 15% 10%, #f3e3c3 0%, transparent 70%),
          radial-gradient(60% 50% at 90% 30%, #f6d6df 0%, transparent 70%), #f5f5f7;
      }
      main {
        width: 100%;
        max-width: 420px;
        text-align: center;
      }
      .kartu {
        background: #fff;
        border-radius: 24px;
        padding: 28px 24px;
        box-shadow: 0 18px 50px rgba(20, 20, 40, 0.12);
      }
      h1 {
        margin: 0 0 6px;
        font-size: 28px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 14px;
        color: #6e6e73;
      }
      .contoh {
        aspect-ratio: 2/3;
        margin: 18px auto;
        width: 70%;
        border-radius: 10px;
        background: #eee;
        display: grid;
        grid-template: 1fr 1fr / 1fr 1fr;
        gap: 6px;
        padding: 8px;
        box-sizing: border-box;
        box-shadow: 0 10px 30px rgba(20, 20, 40, 0.15);
      }
      .contoh i {
        border-radius: 4px;
        background: linear-gradient(135deg, #c9ccd3, #8d939e);
      }
      .tombol {
        display: block;
        padding: 16px;
        border-radius: 999px;
        background: #b08d57;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      small {
        display: block;
        margin-top: 14px;
        color: #86868b;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="kartu">
        <h1>Foto kamu siap!</h1>
        <p>Ini contoh halaman yang dibuka tamu setelah memindai QR di booth Leura.</p>
        <div class="contoh"><i></i><i></i><i></i><i></i></div>
        <span class="tombol">Unduh foto</span>
        <small>Di acara sungguhan, tombol ini mengunduh foto tamu itu sendiri.<br />Foto tersedia selama 7 hari.</small>
      </div>
    </main>
  </body>
</html>
