# Uji otomatis di GitHub: setiap push & Pull Request.
# Pemeriksa kode (ESLint), format (Prettier), lalu semua uji (proses utama, tampilan, demo).
name: Uji

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: uji-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uji:
    # Same tests on Linux, Mac and Windows: Windows work must never break the Mac version.
    name: uji (${{ matrix.os }})
    strategy:
      fail-fast: false # finish every system so each one's result is visible
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1' # uji memakai Electron tiruan, tidak perlu mengunduh Electron
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pasang komponen
        run: npm ci

      - name: Pasang browser untuk uji tampilan
        run: npx playwright install --with-deps chromium

      - name: Pemeriksa kode (ESLint)
        run: npm run lint

      - name: Format kode (Prettier)
        run: npm run format:check

      - name: Uji proses utama
        run: npm run test:utama

      - name: Uji tampilan
        run: npm run test:tampilan

      - name: Simpan bukti uji tampilan yang gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bukti-uji-tampilan-${{ matrix.os }}
          path: tests/hasil-uji/
          if-no-files-found: ignore

      - name: Uji demo HP
        run: npm run uji:demo
